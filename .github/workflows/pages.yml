name: Deploy Table Forge
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Test table engine
        run: |
          node build-engine.cjs --check
          node test.cjs
          node test-features.mjs
          node test-religion.cjs
          node test-religion-template.cjs
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html .nojekyll engine.mjs openapi.json API.md religion-pack.js religion-template.js fantasy-religion-template.txt RELIGION_PACK.md _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
