name: Deploy Table Forge
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Test table engine
        run: |
          node build-engine.cjs --check
          node test.cjs
          node test-features.mjs
          node test-religion.cjs
          node test-religion-template.cjs
          node test-directories.cjs
          node test-deity.cjs
          node test-deity-large.cjs
          node test-table-upload.cjs
          node test-inputs.cjs
          node test-input-or.cjs
          node test-domain-flavor.cjs
          node test-default-content.cjs
          node test-worldbuilding-templates.cjs
          node test-worldbuilding-coverage.cjs
          node test-people-link-repair.cjs
          node test-settlement-locations.cjs
          node test-relationships.cjs
          node test-notable-people.cjs
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir _site
          cp notable-people-v34.js relationship-update-v1.js settlement-update-v1.js worldbuilding-facets-v1.js religion-refresh-v1.js worldbuilding-pack-v1.js worldbuilding-templates.js default-content.js world-template-*.txt index.html .nojekyll engine.mjs openapi.json API.md religion-pack.js religion-folders.js religion-template.js deity-pack.js deity-template.js deity-large-template.js religion-domain-additions.js fantasy-deity-large-template.txt fantasy-deity-template.txt fantasy-religion-template.txt RELIGION_PACK.md _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4



